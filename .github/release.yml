# Categories for GitHub's generated release notes, keyed by the same labels the
# release reads to derive the semver bump. `safe to test` authorises CI runs and
# says nothing about the release, so it is excluded from both.
changelog:
  exclude:
    labels:
      - safe to test
  categories:
    - title: 💥 Breaking Changes
      labels:
        - breaking
    - title: 🚀 Enhancements
      labels:
        - enhancement
    # The catch-all, and so the patch category: under the label convention
    # everything reaching it is a patch. Titled for what it holds rather than
    # the bump it causes, so that it still reads on the many weeks where it is
    # the only section there is.
    - title: 🛠 Fixes & Maintenance
      labels:
        - '*'
